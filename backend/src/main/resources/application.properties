spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5434/docmind
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.open-in-view=false

 spring.ai.openai.api-key=YOUR_API_KEY_HERE
 spring.ai.openai.chat.model=gpt-4o-mini
 spring.ai.openai.embeddings.model=text-embedding-3-small

 #github OAuth2 configuration
spring.security.oauth2.client.registration.github.client-id=YOUR_CLIENT_ID_HERE
spring.security.oauth2.client.registration.github.client-secret=YOUR_CLIENT_SECRET_HERE
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id


server.servlet.session.timeout=DEVPILOT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

#Appsetting
app.frontend.url=http://localhost:3000
app.cors.allowed-origins=http://localhost:3000
app.token-encrypter-password=${TOKEN_ENCRYPTER_PASSWORD:devpilot-local-encrypt-key-change-me}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:deadbeefcafebabe}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app-indexing.chunk-overlap=100
app.github.api-delay-ms=50